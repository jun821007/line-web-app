 name: 每日自動更新報價單
   
   on:
     schedule:
       - cron: '0 5 * * *'
     workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: 檢查代碼
        uses: actions/checkout@v3

      - name: 安裝 Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 安裝 Chrome (截圖用)
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: 安裝套件
        run: pip install google-generativeai gspread google-auth selenium

      - name: 執行爬蟲
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GSPREAD_CREDENTIALS_JSON: ${{ secrets.GSPREAD_CREDENTIALS_JSON }}
          TARGET_URLS_JSON: ${{ secrets.TARGET_URLS_JSON }}
        run: python scraper.py
