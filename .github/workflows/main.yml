name: 每日兩次自動更新報價單

on:
  schedule:
    - cron: '0 0 * * *'  # 台北時間 08:00
    - cron: '0 5 * * *'  # 台北時間 13:00
  workflow_dispatch:      # 讓你可以手動點按鈕更新

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: 檢查代碼
        uses: actions/checkout@v3

      - name: 安裝 Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 安裝 Chrome (截圖用)
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: 安裝套件
        run: |
          pip install google-generativeai gspread oauth2client selenium

      - name: 執行爬蟲
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scraper.py
